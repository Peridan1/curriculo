<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <style>
    .bg-box { fill: #07090e; stroke: url(#gradDark); stroke-width: 2.5; }
    .term-sym { stroke: #00f0ff; opacity: 0.4; }
    .txt-p { fill: url(#gradDark); }
    .txt-d { fill: #f8fafc; }
    .dot-sym { fill: #00ff9d; }

    @media (prefers-color-scheme: light) {
      .bg-box { fill: #f8fafc; stroke: url(#gradLight); stroke-width: 2.5; }
      .term-sym { stroke: #0284c7; opacity: 0.5; }
      .txt-p { fill: #0284c7; }
      .txt-d { fill: #0f172a; }
      .dot-sym { fill: #059669; }
    }
  </style>
  <rect class="bg-box" x="3" y="3" width="58" height="58" rx="16" ry="16" />
  <path class="term-sym" d="M11 20 L16 25 L11 30" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-1.5">
    <text x="17" y="43" class="txt-p">p</text>
    <text x="33" y="43" class="txt-d">d</text>
  </g>
  <circle class="dot-sym" cx="51" cy="41" r="3.5" />
</svg>
