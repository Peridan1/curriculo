name: CI / Quality & Security Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality, i18n & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Validate i18n Dictionary Parity
        run: node .agents/scripts/validate-i18n.mjs

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://peridev.com.br
          NEXT_PUBLIC_ENVIRONMENT: production

  tests:
    name: Unit & E2E Automated Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run Unit & Component Tests with Coverage
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_SITE_URL: https://peridev.com.br

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E & A11y Tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://peridev.com.br

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
