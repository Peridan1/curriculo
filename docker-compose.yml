services:
  curriculo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curriculo-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Opcional: recarregar de arquivo .env se existir
    env_file:
      - .env
